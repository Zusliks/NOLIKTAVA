<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Noliktavas vadības sistēma" />
        <title>Noliktava</title>
        <link rel="stylesheet" href="CSS.css" />
        <script type="module" src="LOGIC.js" defer></script>
    </head>
    <body>
        <main class="app-shell">
            <section class="login-card" aria-labelledby="page-title">
                <h1 id="page-title">NOLIKTAVA</h1>

                <form id="loginForm" novalidate>
                    <label for="username">Lietotājvārds</label>
                    <input type="text" id="username" name="username" autocomplete="username" required />

                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />

                    <button type="submit">Pieslēgties</button>
                </form>

                <p id="loginError" class="message error-message" role="alert" hidden></p>
                <p class="session-label">Sesijas ID: <output id="sessionId">-</output></p>
            </section>



                <form id="REGISTER" .hidden = true, novalidate>
                    <label for="registerUsername">Lietotājvārds</label>
                    <input type="text" id="registerUsername" name="registerUsername" autocomplete="username" required />
                    <if (!username || !password) {showError("Ievadiet lietotājvārdu un paroli.");return;}>  </if>
                    <div id="registerError" class="message error-message" role="alert" hidden></div>

                    <label for="registerPassword">Parole</label>
                    <input type="password" id="registerPassword" name="registerPassword" autocomplete="current-password" required />

                    <button type="submit">Reģistrēties</button>
                </form>



            <section id="dashboard" class="dashboard" aria-labelledby="dashboard-title" hidden>
                <header class="dashboard-header">
                    <div>
                        <p class="eyebrow">Vadību Panelis</p>
                        <h2 id="dashboard-title">Sveicināti, <span id="userName"></span>!</h2>
                    </div>
                    <button id="logoutButton" class="button-secondary" type="button">Izrakstīties</button>
                </header>

                <nav aria-label="Lomas izvēlne">
                    <ul id="roleNavigation" class="role-grid"></ul>
                </nav>
            </section>
        </main>
    </body>
</html>
