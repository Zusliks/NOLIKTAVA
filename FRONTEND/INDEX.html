<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Noliktava</title>
        <link rel="stylesheet" href="CSS/CSS.css" />
        <script type="module" src="JS/LOGIC.js" defer></script>
    </head>
    <body>
        <main class="app-shell">
            <section id="loginView" class="auth-card" aria-labelledby="pageTitle">
                <h1 id="pageTitle">NOLIKTAVA</h1>
                <form id="loginForm" class="auth-form" novalidate>
                    <label for="loginUsername">Lietotājvārds</label>
                    <input type="text" id="loginUsername" name="username" autocomplete="username" required />
                    <label for="loginPassword">Parole</label>
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" required />
                    <button type="submit">Pieslēgties</button>
                </form>
                <p id="loginMessage" class="message" role="alert" hidden></p>
                <p class="auth-link">Nav konta? <a href="REGISTER.html">Reģistrēties</a></p>
            </section>

            <section id="dashboard" class="dashboard" hidden aria-labelledby="dashboardTitle">
                <aside class="sidebar">
                    <div class="sidebar-brand">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 4l9 6v10H3zM8 20v-6h8v6M6 10h12" /></svg>
                        <span>STASH</span>
                    </div>
                    <nav aria-label="Lomas izvēlne">
                        <ul id="sidebarNavigation"></ul>
                    </nav>
                </aside>
                <div id="dashboardContent" class="dashboard-content">
                    <header class="dashboard-header">
                        <div>
                            <p class="eyebrow">Vadības panelis</p>
                            <h2 id="dashboardTitle">Sveicināti, <span id="userName"></span>!</h2>
                            <p id="roleName" class="role-name"></p>
                        </div>
                    </header>
                    <div id="dashboardView"></div>
                </div>
            </section>
        </main>
    </body>
</html>
